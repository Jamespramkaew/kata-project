# บัญชีของสมาชิกแต่ละคน และสิทธิ์ edit เฉพาะห้องของตัวเอง
# token สร้างแยก ไม่เก็บใน GitHub
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pete
  namespace: dev-pete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pete-edit
  namespace: dev-pete
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: pete
    namespace: dev-pete
