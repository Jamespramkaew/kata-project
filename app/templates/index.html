<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Thomas SysAdmin</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@700&family=Noto+Sans+Thai:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;color:#000;font-family:'Noto Sans','Noto Sans Thai',sans-serif;font-weight:700}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 16px;box-sizing:border-box;gap:36px}
.head{display:flex;align-items:center;gap:28px;width:100%;max-width:626px;flex-wrap:wrap}
.head img{width:170px;height:auto}
.head h1{margin:0;font-size:32px}
.card{width:100%;max-width:626px;border:4px solid #000;box-sizing:border-box}
.bar{height:52px;background:#B06D27;border-bottom:4px solid #000;color:#fff;display:flex;align-items:center;padding:0 20px;font-family:monospace;font-size:18px}
.grid{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);padding:30px 40px 40px;font-size:22px}
.grid div{padding:12px 0}
.grid .k{border-right:4px solid #000}
.grid .v{padding-left:24px;word-break:break-all}
.meter{height:14px;border:3px solid #000;margin-top:8px}
.meter span{display:block;height:100%;background:#B06D27}
.mono{font-family:monospace}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img src="{{ url_for('static', filename='joe-miner.jpg') }}" alt="Thomas">
    <h1>Thomas SysAdmin</h1>
  </div>
  <div class="card">
    <div class="bar">root@{{ hostname }}:~$</div>
    <div class="grid">
      <div class="k">System</div><div class="v">{{ system }}</div>
      <div class="k">Kernel</div><div class="v mono">{{ kernel }}</div>
      <div class="k">CPU</div><div class="v">{{ cpu }} core{{ 's' if cpu != 1 }}</div>
      <div class="k">RAM</div>
      <div class="v">{{ mem_used }} / {{ mem_total }} MB
        <div class="meter"><span style="width:{{ mem_pct }}%"></span></div>
      </div>
      <div class="k">Load</div><div class="v mono">{{ load }}</div>
      <div class="k">Uptime</div><div class="v">{{ uptime }}</div>
    </div>
  </div>
</div>
</body>
</html>
