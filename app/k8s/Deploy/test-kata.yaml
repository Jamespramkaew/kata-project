apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-kata
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: test-kata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-kata
    spec:
      runtimeClassName: kata
      containers:
        - name: web
          image: ghcr.io/petewresker/kata-demo:v1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SYSTEM_NAME
              value: Kata